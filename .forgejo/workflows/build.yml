name: build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-medium

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y \
            gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: go mod
        run: go mod download

      - name: build TUI
        run: make build-tui

      - name: build GUI
        run: make build
