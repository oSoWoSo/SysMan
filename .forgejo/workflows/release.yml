name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.019)'
        required: false

jobs:
  release-linux-amd64:
    runs-on: codeberg-medium

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: go mod
        run: go mod download

      - name: build
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          make build
          make build-tui

      - name: tarballs
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd build

          # Individual module tarballs (GUI + TUI) for linux-x86_64
          for module in sysman serman pkgman srcman infman ugsman vmsman; do
            if [ -f "$module" ]; then
              mkdir -p "${module}_pkg"
              cp "$module" "${module}_pkg/"
              cp "${module}-tui" "${module}_pkg/" 2>/dev/null || true
              cp -r lang/ "${module}_pkg/" 2>/dev/null || true
              tar czf "${module}-${VERSION}-linux-x86_64.tar.gz" "${module}_pkg"
              sha256sum "${module}-${VERSION}-linux-x86_64.tar.gz" > "${module}-${VERSION}-linux-x86_64.tar.gz.sha256"
              rm -rf "${module}_pkg"
              echo "Created ${module}-${VERSION}-linux-x86_64.tar.gz"
            fi
          done

          # TUI-only tarballs for linux-x86_64-musl (same static binary, musl-labelled)
          for bin in sysman-tui serman-tui ugsman-tui infman-tui srcman-tui pkgman-tui vmsman-tui; do
            [ -f "$bin" ] || continue
            name="${bin}-${VERSION}-linux-x86_64-musl"
            cp "$bin" "$name"
            sha256sum "$name" > "${name}.sha256"
            tar czf "${name}.tar.gz" "$name" lang/ 2>/dev/null || tar czf "${name}.tar.gz" "$name"
            rm "$name"
          done

          # Create "all" tarball with all binaries (linux-x86_64)
          mkdir -p all
          for f in sysman serman pkgman srcman infman ugsman vmsman \
                   sysman-tui serman-tui pkgman-tui srcman-tui infman-tui ugsman-tui vmsman-tui; do
            [ -f "$f" ] && cp "$f" all/ 2>/dev/null || true
          done
          cp -r lang/* all/ 2>/dev/null || true
          tar czf "SysMan-${VERSION}-linux-x86_64.tar.gz" all/
          sha256sum "SysMan-${VERSION}-linux-x86_64.tar.gz" > "SysMan-${VERSION}-linux-x86_64.tar.gz.sha256"
          rm -rf all

      - name: release
        env:
          TEA: ${{ secrets.TEA }}
        run: |
          if [ -z "${TEA}" ]; then
            echo "ERROR: TEA secret is not set."
            echo "Add it (organization or repository secret) at: https://codeberg.org/oSoWoSo/SysMan/settings/actions"
            echo "Name: TEA"
            exit 1
          fi

          VERSION=${{ steps.version.outputs.VERSION }}
          REPO="oSoWoSo/SysMan"
          API="https://codeberg.org/api/v1"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            CHANGELOG=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
          else
            CHANGELOG="Initial release"
          fi

          # Create release with changelog
          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${API}/repos/${REPO}/releases" \
            -H "Authorization: token ${TEA}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"${VERSION}\",\"body\":\"$(echo "${CHANGELOG}" | sed 's/"/\\"/g' | tr '\n' ' ')\",\"draft\":false}")

          HTTP_CODE=$(echo "$RELEASE_RESPONSE" | tail -1)
          RELEASE_BODY=$(echo "$RELEASE_RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "201" ]; then
            echo "ERROR: Failed to create release (HTTP ${HTTP_CODE}):"
            echo "${RELEASE_BODY}"
            exit 1
          fi

          RELEASE_ID=$(echo "${RELEASE_BODY}" | grep '"id"' | head -1 | grep -o '[0-9]*')
          echo "Created release ${VERSION} (ID: ${RELEASE_ID})"

          # Upload all tarballs and checksums
          for f in build/*.tar.gz build/*.sha256; do
            [ -f "$f" ] || continue
            ASSET_URL="${API}/repos/${REPO}/releases/${RELEASE_ID}/assets"
            curl -s -X POST "${ASSET_URL}" \
              -H "Authorization: token ${TEA}" \
              -F "attachment=@${f}" && echo "Uploaded $(basename $f)"
          done

  release-cross:
    runs-on: codeberg-medium
    needs: release-linux-amd64

    strategy:
      matrix:
        include:
          # Void Linux supported architectures (TUI only — CGO-free, fully static)
          # glibc variants
          - goos: linux
            goarch: arm64
            label: linux-aarch64
            musl_label: linux-aarch64-musl
          - goos: linux
            goarch: "386"
            label: linux-i686
            musl_label: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            label: linux-armv7l
            musl_label: linux-armv7l-musl
          - goos: linux
            goarch: arm
            goarm: "6"
            label: linux-armv6l
            musl_label: linux-armv6l-musl
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            label: ""
            musl_label: linux-mipsel-musl
          # Other platforms
          - goos: freebsd
            goarch: amd64
            label: freebsd-amd64
            musl_label: ""
          - goos: freebsd
            goarch: arm64
            label: freebsd-arm64
            musl_label: ""
          - goos: openbsd
            goarch: amd64
            label: openbsd-amd64
            musl_label: ""
          - goos: openbsd
            goarch: arm64
            label: openbsd-arm64
            musl_label: ""

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: go mod
        run: go mod download

      - name: build TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: make build-tui

      - name: package TUI
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          LABEL: ${{ matrix.label }}
          MUSL_LABEL: ${{ matrix.musl_label }}
        run: |
          cd build
          for bin in sysman-tui serman-tui ugsman-tui infman-tui srcman-tui pkgman-tui vmsman-tui; do
            [ -f "$bin" ] || continue

            # glibc-labelled tarball
            if [ -n "${LABEL}" ]; then
              name="${bin}-${VERSION}-${LABEL}"
              cp "$bin" "$name"
              sha256sum "$name" > "${name}.sha256"
              tar czf "${name}.tar.gz" "$name" lang/ 2>/dev/null || tar czf "${name}.tar.gz" "$name"
              rm "$name"
            fi

            # musl-labelled tarball (same static binary, different name)
            if [ -n "${MUSL_LABEL}" ]; then
              name="${bin}-${VERSION}-${MUSL_LABEL}"
              cp "$bin" "$name"
              sha256sum "$name" > "${name}.sha256"
              tar czf "${name}.tar.gz" "$name" lang/ 2>/dev/null || tar czf "${name}.tar.gz" "$name"
              rm "$name"
            fi
          done

      - name: upload
        env:
          TEA: ${{ secrets.TEA }}
        run: |
          if [ -z "${TEA}" ]; then
            echo "ERROR: TEA secret is not set."
            exit 1
          fi

          VERSION=${{ steps.version.outputs.VERSION }}
          REPO="oSoWoSo/SysMan"
          API="https://codeberg.org/api/v1"

          # Get release ID by tag (release was created by release-linux-amd64 job)
          RELEASE_ID=$(curl -s "${API}/repos/${REPO}/releases/tags/${VERSION}" \
            -H "Authorization: token ${TEA}" | grep '"id"' | head -1 | grep -o '[0-9]*')

          if [ -z "${RELEASE_ID}" ]; then
            echo "ERROR: Could not find release ID for tag ${VERSION}"
            exit 1
          fi

          for f in build/*.tar.gz build/*.sha256; do
            [ -f "$f" ] || continue
            ASSET_URL="${API}/repos/${REPO}/releases/${RELEASE_ID}/assets"
            curl -s -X POST "${ASSET_URL}" \
              -H "Authorization: token ${TEA}" \
              -F "attachment=@${f}" && echo "Uploaded $(basename $f)"
          done
