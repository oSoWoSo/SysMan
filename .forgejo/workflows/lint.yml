name: Lint & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: codeberg-medium

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0
          golangci-lint run --timeout=5m ./...

  test:
    runs-on: codeberg-medium

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y \
           gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -cover -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out | tail -1
